# e54c-server-imagebuilder の宣言的設定
# ここと packages.txt / modules/ / kernel/ だけを編集すれば済むのが設計目標。

# ターゲットの identity (ModulePlan の target になる。image.name は出力名、
# kernel.dtb は boot asset であり、board identity の代用にはしない)
target:
  board: radxa-e54c
  architecture: arm64

# モジュール設定の上書き (module manifest の configuration.defaults に対する
# override。空 {} なら既定値がそのまま使われる)。
# 例: 教育用途で既定ユーザー名を変え、授業中のパスワード変更強制を止める場合:
# moduleConfiguration:
#   default-user:
#     username: student
#     requirePasswordChange: false   # 安全性は下がる。明示的な選択のみ
moduleConfiguration: {}

# secret の参照元 (module manifest の secrets 宣言に対する供給元)。
# 値そのものはここに書かない (環境変数名のみ)
secretReferences:
  default-user:
    initial-password:
      source:
        type: environment
        name: DEFAULT_PASSWORD

image:
  name: e54c-server        # 出力: <name>_<suite>_<version>.img.xz
  hostname: e54c-server
  # ビルド時に確保する仮サイズ (GiB)。最終イメージは実サイズまで自動縮小される
  size_gb: 8

debian:
  suite: trixie
  mirror: https://deb.debian.org/debian
  components:
    - main
    - contrib
    - non-free-firmware
  # mmdebstrap variant。apt = essential + apt の最小構成から積み上げる
  variant: apt

kernel:
  # kernel.org のバージョン。rc も指定可 (例: "7.3-rc4")
  # 7.3 リリース (E54C DTS 上流化見込み) 後に "7.3" へ切り替える
  version: "7.2"
  localversion: "-e54c1"
  # ベース config:
  #   defconfig = arch/arm64 の defconfig を seed (高速。必要機能は
  #               fragments で明示し、ビルド時に反映検証される)
  #   debian    = Debian の arm64 config を seed (網羅的。モジュール数 ~2.7 倍で
  #               ビルド時間は数倍。arm64 コンテナの devcontainer でのみ利用可)
  # debian を既定とする (Issue #2)。ハードウェア面の不足が無いことは
  # research-notes/19-kernel-config-comparison.md で確認済み。
  # 唯一のギャップ (Debian は NET_DSA_REALTEK を明示無効) は fragments が上書きする
  base_config: debian
  fragments:
    - kernel/config/e54c.config
  # kernel/patches/*.patch が series 順 (ファイル名昇順) に git apply される。
  # kernel/dts/*.dts は arch/arm64/boot/dts/rockchip/ に「in-tree に同名が無い場合のみ」
  # コピーされ、Makefile に自動登録される (7.3 で上流化されたら自然に無効化される)
  dtb: rockchip/rk3582-radxa-e54c.dtb

uboot:
  # 当面は Radxa の vendor U-Boot deb を流用する
  # (vendor U-Boot + extlinux で mainline カーネルが起動することは実証済み。
  #  RK3582 の選別コア無効化も vendor U-Boot が DT を書き換えてくれる)。
  # 導入する deb 自体は dependencies.lock.yaml で URL+sha256 を固定している。
  # ここは成果物イメージに書き込む「配備後の更新用リポジトリ」の設定
  apt_repo: https://radxa-repo.github.io/bookworm
  apt_suite: bookworm
