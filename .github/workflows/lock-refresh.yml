name: Refresh lock hashes
# Renovate は dependencies.lock.yaml の version と Dockerfile の base digest しか
# 更新できないため、Renovate の PR で url / sha256 / lock 側の base_image を
# 再導出して追随させる。
#
# セキュリティ設計:
# - 対象は Renovate の PR のみ (人間の PR は手元で refresh-lock.py を実行する)
# - write トークンを持つこの workflow は、PR head のスクリプトを実行しない:
#   スクリプト類は必ず base (main) の版を使い、PR からは対象ファイル
#   (dependencies.lock.yaml / .devcontainer/Dockerfile) だけを取り込む
on:
  pull_request:
    paths:
      - dependencies.lock.yaml
      - .devcontainer/Dockerfile

permissions:
  contents: write
  actions: write

jobs:
  refresh:
    # Renovate の同一リポジトリ PR のみ (fork には push できない)
    if: >
      github.event.pull_request.head.repo.full_name == github.repository &&
      (github.actor == 'renovate[bot]' || github.actor == 'renovate-bot')
    runs-on: ubuntu-latest
    steps:
      # base (信頼済み) の作業ツリーをベースにする
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base

      # PR head は別ディレクトリに checkout し、対象ファイルだけを取り込む
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}
          path: head

      - name: Refresh lock (base のスクリプトで head の lock を更新)
        run: |
          cp head/dependencies.lock.yaml base/dependencies.lock.yaml
          cp head/.devcontainer/Dockerfile base/.devcontainer/Dockerfile
          cd base
          python3 scripts/refresh-lock.py
          python3 scripts/lock-get.py kernel.sha256 > /dev/null  # 整合検証

      - name: Commit and re-dispatch validation if changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if cmp -s base/dependencies.lock.yaml head/dependencies.lock.yaml; then
            echo "lock は整合済み"
            exit 0
          fi
          cp base/dependencies.lock.yaml head/dependencies.lock.yaml
          cd head
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dependencies.lock.yaml
          git commit -m "lock: url / sha256 / base_image を追随 (refresh-lock.py)"
          git push
          # GITHUB_TOKEN の push は pull_request 系 workflow を再トリガーしない
          # ため、フルビルド検証を明示的に起動する (release job は
          # event_name == push ガードで発火しない)
          gh workflow run release.yml --ref "${{ github.head_ref }}"
