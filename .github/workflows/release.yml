name: Build and release image
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

# 連続 push 時は古いビルドをキャンセルして最新だけ走らせる
concurrency:
  group: build-release
  cancel-in-progress: true

env:
  DEVCONTAINER_IMAGE: ghcr.io/${{ github.repository }}/devcontainer

jobs:
  build:
    # arm64 ランナー (パブリックリポジトリでは無料)。QEMU 不要のネイティブビルド。
    # amd64 ランナーに戻す場合は ubuntu-latest + docker/setup-qemu-action を復活させること
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      # --- キャッシュ 1: カーネル deb (入力が変わらなければビルド丸ごとスキップ) ---
      - name: Restore kernel debs
        uses: actions/cache@v4
        with:
          path: out/debs
          key: kernel-debs-${{ runner.arch }}-${{ hashFiles('config.yaml', 'kernel/**', 'scripts/build-kernel.sh') }}

      # --- キャッシュ 2: ccache (カーネル入力が変わったときの再コンパイル短縮) ---
      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: out/ccache
          key: ccache-${{ runner.arch }}-${{ github.run_id }}
          restore-keys: |
            ccache-${{ runner.arch }}-

      # --- キャッシュ 3: devcontainer イメージ (GHCR に push して次回以降 pull) ---
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate version (CalVer, JST)
        id: ver
        run: echo "version=$(TZ=Asia/Tokyo date +v%Y.%m.%d-%H%M)" >> "$GITHUB_OUTPUT"

      # ローカル開発と同一の devcontainer 内でビルドする (環境の一致を保証)
      - name: Build within devcontainer
        uses: devcontainers/ci@v0.3
        with:
          imageName: ${{ env.DEVCONTAINER_IMAGE }}
          cacheFrom: ${{ env.DEVCONTAINER_IMAGE }}
          push: always
          runCmd: |
            set -euo pipefail
            export CCACHE_DIR="$PWD/out/ccache"
            make ci VERSION=${{ steps.ver.outputs.version }}
            cd out && sha512sum *.img.xz > SHA512SUMS

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.version }}
          files: |
            out/*.img.xz
            out/SHA512SUMS
            out/rootfs/build/manifest
            out/rootfs/bdebstrap.yaml
