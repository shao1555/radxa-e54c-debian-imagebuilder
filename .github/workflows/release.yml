name: Build and release image
on:
  push:
    branches: [main]
  workflow_dispatch:

# 連続 push 時は古いビルドをキャンセルして最新だけ走らせる
concurrency:
  group: build-release
  cancel-in-progress: true

env:
  DEVCONTAINER_IMAGE: ghcr.io/${{ github.repository }}/devcontainer

# - arm64 ランナー (パブリックリポジトリでは無料) でネイティブビルドする。
#   amd64 に戻す場合は ubuntu-latest + docker/setup-qemu-action を復活させること
# - サプライチェーン対策として action はすべてコミット SHA で固定する
#   (コメントのバージョンは参照用)

jobs:
  # ステージ 0: ビルド環境イメージ。日付 + .devcontainer の内容ハッシュをタグにし、
  # GHCR に存在すればビルドせず再利用する (日次ローテでビルドツール側の apt も更新)。
  # 下流ジョブはこのタグを docker run するだけで、イメージ構築は行わない
  devcontainer:
    runs-on: ubuntu-24.04-arm
    permissions:
      packages: write
    outputs:
      image: ${{ steps.tag.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tag (date + .devcontainer hash)
        id: tag
        run: |
          hash="${{ hashFiles('.devcontainer/**') }}"
          tag="$(TZ=Asia/Tokyo date +%Y%m%d)-${hash:0:12}-${{ runner.arch }}"
          echo "image=${DEVCONTAINER_IMAGE}:${tag}" >> "$GITHUB_OUTPUT"

      - name: Build and push if missing
        run: |
          img="${{ steps.tag.outputs.image }}"
          if docker manifest inspect "$img" > /dev/null 2>&1; then
            echo "==> $img exists, skipping build"
          else
            docker build -t "$img" .devcontainer/
            docker push "$img"
          fi

  # ステージ 1: カーネル deb。入力が変わらなければキャッシュ復元だけで数秒
  kernel:
    needs: devcontainer
    runs-on: ubuntu-24.04-arm
    permissions:
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Restore kernel debs
        id: debs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: out/debs
          key: kernel-debs-${{ runner.arch }}-${{ hashFiles('config.yaml', 'kernel/**', 'scripts/build-kernel.sh') }}

      - name: Restore ccache
        if: steps.debs.outputs.cache-hit != 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: out/ccache
          key: ccache-${{ runner.arch }}-${{ github.run_id }}
          restore-keys: |
            ccache-${{ runner.arch }}-

      - name: Log in to GHCR
        if: steps.debs.outputs.cache-hit != 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build kernel
        if: steps.debs.outputs.cache-hit != 'true'
        run: |
          docker run --rm --privileged \
            -v "$PWD":/ws -w /ws \
            -v e54c-kernel-build:/build -e E54C_BUILD_DIR=/build \
            -e CCACHE_DIR=/ws/out/ccache \
            "${{ needs.devcontainer.outputs.image }}" make kernel

      - name: Upload kernel debs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kernel-debs
          path: out/debs/*.deb
          if-no-files-found: error

  # ステージ 2: rootfs 構築。キャッシュキーに日付を含めた日次ローテ:
  # 同日の再 push は高速化しつつ、翌日には必ず fresh な apt 状態で作り直す
  # (永続キャッシュにすると Debian のセキュリティ更新が取り込まれなくなるため)
  rootfs:
    needs: [devcontainer, kernel]
    runs-on: ubuntu-24.04-arm
    permissions:
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Date stamp (JST)
        id: date
        run: echo "date=$(TZ=Asia/Tokyo date +%Y%m%d)" >> "$GITHUB_OUTPUT"

      - name: Restore rootfs
        id: rootfs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: out/rootfs
          key: rootfs-${{ runner.arch }}-${{ steps.date.outputs.date }}-${{ hashFiles('config.yaml', 'packages.txt', 'files/**', 'hooks/**', 'kernel/**', 'scripts/build-kernel.sh', 'scripts/build-rootfs.sh', 'scripts/render-bdebstrap.py') }}

      - name: Download kernel debs
        if: steps.rootfs.outputs.cache-hit != 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: kernel-debs
          path: out/debs

      - name: Log in to GHCR
        if: steps.rootfs.outputs.cache-hit != 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build rootfs
        if: steps.rootfs.outputs.cache-hit != 'true'
        run: |
          docker run --rm --privileged \
            -v "$PWD":/ws -w /ws \
            "${{ needs.devcontainer.outputs.image }}" make rootfs

      - name: Upload rootfs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rootfs
          path: out/rootfs/build/rootfs.tar
          if-no-files-found: error

      - name: Upload rootfs metadata
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rootfs-meta
          path: |
            out/rootfs/build/manifest
            out/rootfs/bdebstrap.yaml
          if-no-files-found: error

  # ステージ 3: イメージ組み立て (guestfish)。rootfs.tar だけを入力に取る。
  # このジョブだけ x64 ランナー: GitHub の x64 ランナーは KVM (nested virt) が
  # 使えるため、libguestfs のアプライアンスが TCG (arm64 ランナー、~7.5 分) では
  # なく KVM で走る。アプライアンスはホストアーキで起動し、行うのはファイル
  # システム操作のみなので、x86_64 アプライアンスで arm64 イメージを扱ってよい
  image:
    needs: rootfs
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download rootfs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: rootfs
          path: out/rootfs/build

      - name: Enable KVM and install tools
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libguestfs-tools gdisk parted python3-yaml xz-utils
          # libguestfs のアプライアンスがホストカーネルを読めるようにする
          sudo chmod +r /boot/vmlinuz-*
          ls -la /dev/kvm || echo "WARN: /dev/kvm 不在 → TCG にフォールバック"

      - name: Generate version (CalVer, JST)
        id: ver
        run: echo "version=$(TZ=Asia/Tokyo date +v%Y.%m.%d-%H%M)" >> "$GITHUB_OUTPUT"

      - name: Build image
        run: |
          make image IMG_VERSION=${{ steps.ver.outputs.version }}
          cd out && sha512sum *.img.xz > SHA512SUMS

      - name: Upload image
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image
          path: |
            out/*.img.xz
            out/SHA512SUMS
          if-no-files-found: error

  # ステージ 4: リリース作成のみ (devcontainer 不要・contents: write のみ)
  release:
    needs: [rootfs, image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download image
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: image
          path: out

      - name: Download rootfs metadata
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: rootfs-meta
          path: out/meta

      - name: Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ needs.image.outputs.version }}
          files: |
            out/*.img.xz
            out/SHA512SUMS
            out/meta/**
