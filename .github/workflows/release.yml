name: Build and release image
on:
  push:
    branches: [main]
  workflow_dispatch:

# 連続 push 時は古いビルドをキャンセルして最新だけ走らせる
concurrency:
  group: build-release
  cancel-in-progress: true

env:
  DEVCONTAINER_IMAGE: ghcr.io/${{ github.repository }}/devcontainer

# - arm64 ランナー (パブリックリポジトリでは無料) でネイティブビルドする。
#   amd64 に戻す場合は ubuntu-latest + docker/setup-qemu-action を復活させること
# - サプライチェーン対策として action はすべてコミット SHA で固定する
#   (コメントのバージョンは参照用)

jobs:
  # ステージ 1: カーネル deb。入力が変わらなければキャッシュ復元だけで数秒
  kernel:
    runs-on: ubuntu-24.04-arm
    permissions:
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Restore kernel debs
        id: debs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: out/debs
          key: kernel-debs-${{ runner.arch }}-${{ hashFiles('config.yaml', 'kernel/**', 'scripts/build-kernel.sh') }}

      - name: Restore ccache
        if: steps.debs.outputs.cache-hit != 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: out/ccache
          key: ccache-${{ runner.arch }}-${{ github.run_id }}
          restore-keys: |
            ccache-${{ runner.arch }}-

      - name: Log in to GHCR
        if: steps.debs.outputs.cache-hit != 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build kernel within devcontainer
        if: steps.debs.outputs.cache-hit != 'true'
        uses: devcontainers/ci@513af61f4de4f75d37e4438f184ba4358f0fc1ca # v0.3.1900000450
        with:
          imageName: ${{ env.DEVCONTAINER_IMAGE }}
          cacheFrom: ${{ env.DEVCONTAINER_IMAGE }}
          push: always
          runCmd: |
            set -euo pipefail
            export CCACHE_DIR="$PWD/out/ccache"
            make kernel

      - name: Upload kernel debs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kernel-debs
          path: out/debs/*.deb
          if-no-files-found: error

  # ステージ 2: rootfs 構築。キャッシュキーに日付を含めた日次ローテ:
  # 同日の再 push は高速化しつつ、翌日には必ず fresh な apt 状態で作り直す
  # (永続キャッシュにすると Debian のセキュリティ更新が取り込まれなくなるため)
  rootfs:
    needs: kernel
    runs-on: ubuntu-24.04-arm
    permissions:
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Date stamp (JST)
        id: date
        run: echo "date=$(TZ=Asia/Tokyo date +%Y%m%d)" >> "$GITHUB_OUTPUT"

      - name: Restore rootfs
        id: rootfs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: out/rootfs
          key: rootfs-${{ runner.arch }}-${{ steps.date.outputs.date }}-${{ hashFiles('config.yaml', 'packages.txt', 'files/**', 'hooks/**', 'kernel/**', 'scripts/build-kernel.sh', 'scripts/build-rootfs.sh', 'scripts/render-bdebstrap.py') }}

      - name: Download kernel debs
        if: steps.rootfs.outputs.cache-hit != 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: kernel-debs
          path: out/debs

      - name: Log in to GHCR
        if: steps.rootfs.outputs.cache-hit != 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build rootfs within devcontainer
        if: steps.rootfs.outputs.cache-hit != 'true'
        uses: devcontainers/ci@513af61f4de4f75d37e4438f184ba4358f0fc1ca # v0.3.1900000450
        with:
          imageName: ${{ env.DEVCONTAINER_IMAGE }}
          cacheFrom: ${{ env.DEVCONTAINER_IMAGE }}
          push: always
          runCmd: |
            set -euo pipefail
            make rootfs

      - name: Upload rootfs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rootfs
          path: out/rootfs/build/rootfs.tar
          if-no-files-found: error

      - name: Upload rootfs metadata
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rootfs-meta
          path: |
            out/rootfs/build/manifest
            out/rootfs/bdebstrap.yaml
          if-no-files-found: error

  # ステージ 3: イメージ組み立て (guestfish)。rootfs.tar だけを入力に取る
  image:
    needs: rootfs
    runs-on: ubuntu-24.04-arm
    permissions:
      packages: write
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download rootfs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: rootfs
          path: out/rootfs/build

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate version (CalVer, JST)
        id: ver
        run: echo "version=$(TZ=Asia/Tokyo date +v%Y.%m.%d-%H%M)" >> "$GITHUB_OUTPUT"

      - name: Build image within devcontainer
        uses: devcontainers/ci@513af61f4de4f75d37e4438f184ba4358f0fc1ca # v0.3.1900000450
        with:
          imageName: ${{ env.DEVCONTAINER_IMAGE }}
          cacheFrom: ${{ env.DEVCONTAINER_IMAGE }}
          push: always
          runCmd: |
            set -euo pipefail
            make image VERSION=${{ steps.ver.outputs.version }}
            cd out && sha512sum *.img.xz > SHA512SUMS

      - name: Upload image
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image
          path: |
            out/*.img.xz
            out/SHA512SUMS
          if-no-files-found: error

  # ステージ 4: リリース作成のみ (devcontainer 不要・contents: write のみ)
  release:
    needs: [rootfs, image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download image
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: image
          path: out

      - name: Download rootfs metadata
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: rootfs-meta
          path: out/meta

      - name: Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ needs.image.outputs.version }}
          files: |
            out/*.img.xz
            out/SHA512SUMS
            out/meta/**
