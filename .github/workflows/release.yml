name: Build and release image
on:
  push:
    branches: [main]
  # PR でも release 以外の全ジョブ (devcontainer 〜 boot-test) を走らせ、
  # 依存更新 PR (snapshot / lock) をマージ前にフル検証する。
  # PR ではさらに再現性検証 (rootfs 二重ビルドの manifest 一致) も行う
  pull_request:
  workflow_dispatch:

# 同一 ref の連続 push は古いビルドをキャンセルして最新だけ走らせる
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

# 既定は最小権限 (Code Scanning: actions/missing-workflow-permissions)。
# 追加権限は各ジョブが個別に宣言する
permissions:
  contents: read

env:
  DEVCONTAINER_IMAGE: ghcr.io/${{ github.repository }}/devcontainer

# - arm64 ランナー (パブリックリポジトリでは無料) でネイティブビルドする。
#   amd64 に戻す場合は ubuntu-latest + docker/setup-qemu-action を復活させること
# - サプライチェーン対策として action はすべてコミット SHA で固定する
#   (コメントのバージョンは参照用)

jobs:
  # ステージ 0: ビルド環境イメージ (arm64: kernel / rootfs 用)。
  # .devcontainer の内容ハッシュをタグにし、GHCR に存在すればビルドしない。
  # 下流ジョブはこのタグを docker run するだけで、イメージ構築は行わない
  devcontainer:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.tag.outputs.image }}
      digest: ${{ steps.seed.outputs.digest }}
      # base_config=debian の seed (linux-config パッケージ) の識別子。
      # kernel ジョブがキャッシュキーに使う (kernel ジョブでのイメージ pull を
      # 避けるため、イメージを手元に持つこのジョブで取得する)
      seed: ${{ steps.seed.outputs.seed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tag (.devcontainer content hash)
        # 日付ローテは廃止: ベースイメージ digest と APT snapshot を Dockerfile で
        # 固定したため、同じ内容なら同じイメージを使い続けるのが正しい。
        # 更新は dependencies.lock.yaml + Dockerfile の更新 PR で行う
        id: tag
        run: |
          hash="${{ hashFiles('.devcontainer/**') }}"
          tag="${hash:0:16}-${{ runner.arch }}"
          echo "image=${DEVCONTAINER_IMAGE}:${tag}" >> "$GITHUB_OUTPUT"

      # seed (linux-config パッケージのバージョン) はイメージの LABEL に焼き込む。
      # 既存イメージの経路では imagetools inspect が manifest + config blob (数 KB)
      # だけを読むため、レイヤーの pull は発生しない (= キャッシュヒット時の
      # workflow 全体が高速のまま)。LABEL の無い過去イメージには docker run で
      # フォールバックする (1 回だけ pull が走り、翌日のローテで自然に解消)
      - name: Build and push if missing
        id: seed
        run: |
          img="${{ steps.tag.outputs.image }}"
          if docker manifest inspect "$img" > /dev/null 2>&1; then
            echo "==> $img exists, skipping build"
            seed="$(docker buildx imagetools inspect "$img" \
              --format '{{ index .Image.Config.Labels "e54c.kernel-config-seed" }}')"
            if [[ -z $seed ]]; then
              echo "==> no seed label (old image), falling back to docker run"
              seed="$(docker run --rm "$img" \
                dpkg-query -W -f '${Package}=${Version}' 'linux-config-*')"
            fi
          else
            docker build -t "$img" .devcontainer/
            seed="$(docker run --rm "$img" \
              dpkg-query -W -f '${Package}=${Version}' 'linux-config-*')"
            # レイヤーは全てキャッシュ済みのため、LABEL 付け直しは数秒で終わる
            docker build --label "e54c.kernel-config-seed=$seed" -t "$img" .devcontainer/
            docker push "$img"
          fi
          [[ -n $seed ]] || { echo "エラー: seed バージョンを取得できない" >&2; exit 1; }
          echo "seed=$seed" >> "$GITHUB_OUTPUT"
          # provenance 用にイメージの manifest digest も出力する
          digest="$(docker buildx imagetools inspect "$img" --format '{{ .Manifest.Digest }}')"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

  # ステージ 0': ビルド環境イメージ (amd64: image / boot-test 用)。
  # 同じ Dockerfile を x64 でビルドする。x64 ランナーは KVM が使えるため、
  # libguestfs / QEMU 系のジョブはこちらのイメージで走らせる
  devcontainer-amd64:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.tag.outputs.image }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tag (.devcontainer content hash)
        id: tag
        run: |
          hash="${{ hashFiles('.devcontainer/**') }}"
          tag="${hash:0:16}-${{ runner.arch }}"
          echo "image=${DEVCONTAINER_IMAGE}:${tag}" >> "$GITHUB_OUTPUT"

      - name: Build and push if missing
        id: build
        run: |
          img="${{ steps.tag.outputs.image }}"
          if docker manifest inspect "$img" > /dev/null 2>&1; then
            echo "==> $img exists, skipping build"
          else
            docker build -t "$img" .devcontainer/
            docker push "$img"
          fi
          digest="$(docker buildx imagetools inspect "$img" --format '{{ .Manifest.Digest }}')"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

  # ステージ 1: カーネル deb。入力が変わらなければキャッシュ復元だけで数秒
  kernel:
    needs: devcontainer
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: read
    outputs:
      # rootfs ジョブがキャッシュキーに含める (新 seed で kernel deb が変わった
      # のに rootfs が同日分の旧キャッシュにヒットして古いカーネル入り rootfs を
      # リリースするのを防ぐ)
      debs-key: ${{ steps.key.outputs.key }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # キャッシュキーの構成要素:
      # - config.yaml は kernel セクションのみハッシュする (hostname 等の変更で
      #   63 分のカーネル再ビルドが走るのを防ぐ)
      # - base_config=debian の seed (devcontainer 内の linux-config パッケージ)
      #   のバージョンを含める (seed 更新の取りこぼしと、キャッシュ消失時に
      #   同一コミットから異なるカーネルが出るのを防ぐ)。値は devcontainer
      #   ジョブが出力する (このジョブでイメージを pull しないため、
      #   キャッシュヒット時は数秒で終わる性質を保つ)
      - name: Compute kernel cache key
        id: key
        run: |
          python3 -c "import yaml" 2> /dev/null || pip install --quiet PyYAML
          ksec="$(python3 -c "import yaml, json, hashlib; k = yaml.safe_load(open('config.yaml'))['kernel']; print(hashlib.sha256(json.dumps(k, sort_keys=True).encode()).hexdigest()[:16])")"
          echo "key=kernel-debs-${{ runner.arch }}-${ksec}-${{ needs.devcontainer.outputs.seed }}-${{ hashFiles('kernel/**', 'scripts/build-kernel.sh', 'dependencies.lock.yaml', 'scripts/lock-get.py') }}" >> "$GITHUB_OUTPUT"

      - name: Restore kernel debs
        id: debs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: out/debs
          key: ${{ steps.key.outputs.key }}

      - name: Restore ccache
        if: steps.debs.outputs.cache-hit != 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: out/ccache
          key: ccache-${{ runner.arch }}-${{ github.run_id }}
          restore-keys: |
            ccache-${{ runner.arch }}-

      - name: Log in to GHCR
        if: steps.debs.outputs.cache-hit != 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build kernel
        if: steps.debs.outputs.cache-hit != 'true'
        run: |
          docker run --rm --privileged \
            -v "$PWD":/ws -w /ws \
            -v e54c-kernel-build:/build -e E54C_BUILD_DIR=/build \
            -e CCACHE_DIR=/ws/out/ccache \
            "${{ needs.devcontainer.outputs.image }}" make kernel

      - name: Upload kernel debs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kernel-debs
          path: out/debs/*.deb
          if-no-files-found: error

  # ステージ 2: rootfs 構築。パッケージ解決は dependencies.lock.yaml の
  # Debian snapshot に固定されているため、キャッシュは入力の content hash のみで
  # 管理する (日次ローテは廃止。セキュリティ更新は snapshot 更新 PR で取り込む)
  rootfs:
    needs: [devcontainer, kernel]
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Restore rootfs
        id: rootfs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: out/rootfs
          # workflow 自体もキーに含める (DEFAULT_PASSWORD 等、この場で決まる
          # 入力の変更で古い rootfs キャッシュが再利用されるのを防ぐ)。
          # kernel deb のキー (seed 含む) と devcontainer イメージ識別子も含め、
          # カーネルやビルド環境が変わったのに旧 rootfs を再利用しないようにする
          key: rootfs-${{ runner.arch }}-${{ needs.kernel.outputs.debs-key }}-${{ needs.devcontainer.outputs.image }}-${{ hashFiles('config.yaml', 'packages.txt', 'dependencies.lock.yaml', 'scripts/lock-get.py', 'files/**', 'hooks/**', 'scripts/build-rootfs.sh', 'scripts/verify-build-env.sh', 'scripts/render-bdebstrap.py', '.github/workflows/release.yml') }}

      - name: Download kernel debs
        if: steps.rootfs.outputs.cache-hit != 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: kernel-debs
          path: out/debs

      - name: Log in to GHCR
        if: steps.rootfs.outputs.cache-hit != 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build rootfs
        if: steps.rootfs.outputs.cache-hit != 'true'
        # リリースイメージのデフォルトユーザーは debian / debian (公開値)。
        # SSH ホスト鍵はビルド時に除去され、各端末の初回起動時に生成される
        run: |
          docker run --rm --privileged \
            -v "$PWD":/ws -w /ws \
            -e DEFAULT_PASSWORD=debian \
            "${{ needs.devcontainer.outputs.image }}" scripts/build-rootfs.sh

      # 再現性検証 (PR のみ): 同じ lock からもう一度 rootfs を解決し、
      # package/version manifest が一致することを確認する。snapshot 固定が
      # 正しく機能していれば完全一致するはず (Issue #4 の受け入れ条件)
      - name: Reproducibility check (PR)
        if: github.event_name == 'pull_request' && steps.rootfs.outputs.cache-hit != 'true'
        run: |
          cp out/rootfs/build/manifest /tmp/manifest.first
          docker run --rm --privileged \
            -v "$PWD":/ws -w /ws \
            -e DEFAULT_PASSWORD=debian \
            "${{ needs.devcontainer.outputs.image }}" scripts/build-rootfs.sh
          if ! diff -u /tmp/manifest.first out/rootfs/build/manifest; then
            echo "エラー: 同じ lock からの再ビルドで manifest が一致しない (再現性の破れ)" >&2
            exit 1
          fi
          echo "reproducibility check passed: manifest が一致"

      # キャッシュ復元・新規ビルドのどちらの経路でも回帰検査を通す
      # (tar listing + initrd 内部検査。lsinitramfs が必要)
      - name: Smoke test rootfs
        run: |
          command -v lsinitramfs > /dev/null || \
            sudo apt-get install -y --no-install-recommends initramfs-tools-core
          scripts/smoke-test-rootfs.sh

      # 依存更新 PR のレビュー用に、最新リリースの manifest との差分を
      # job summary に出す (追加・削除・version 変更が一覧できる)
      - name: Manifest diff vs latest release (PR)
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "## rootfs manifest diff (最新リリース → この PR)"
            if gh release download --repo "$GITHUB_REPOSITORY" --pattern manifest -O /tmp/release-manifest 2> /dev/null; then
              echo '```diff'
              diff -u /tmp/release-manifest out/rootfs/build/manifest || true
              echo '```'
            else
              echo "(比較対象のリリース manifest が見つからない)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # provenance 用: ビルド環境 (devcontainer) のパッケージ一覧
      - name: Build environment manifest
        run: |
          mkdir -p out/meta
          docker run --rm "${{ needs.devcontainer.outputs.image }}" \
            dpkg-query -W -f '${Package}=${Version}\n' > out/meta/build-env-arm64.txt

      - name: Upload rootfs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rootfs
          path: out/rootfs/build/rootfs.tar
          if-no-files-found: error

      - name: Upload rootfs metadata
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rootfs-meta
          path: |
            out/rootfs/build/manifest
            out/rootfs/bdebstrap.yaml
            out/meta/build-env-arm64.txt
          if-no-files-found: error

  # ステージ 3: イメージ組み立て (guestfish)。rootfs.tar だけを入力に取る。
  # このジョブは x64 ランナー: GitHub の x64 ランナーは KVM (nested virt) が
  # 使えるため、libguestfs のアプライアンスが KVM で走る。アプライアンスは
  # ホストアーキで起動し、行うのはファイルシステム操作のみなので、x86_64
  # アプライアンスで arm64 イメージを扱ってよい。
  # ツールチェーン (guestfish / e2fsprogs / sgdisk) は成果物を左右するため、
  # ランナーに apt install せず snapshot 固定済みの devcontainer 内で実行する
  image:
    needs: [devcontainer-amd64, rootfs]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download rootfs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: rootfs
          path: out/rootfs/build

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
          ls -la /dev/kvm || echo "WARN: /dev/kvm 不在 → TCG にフォールバック"

      - name: Generate version (CalVer, JST)
        id: ver
        run: echo "version=$(TZ=Asia/Tokyo date +v%Y.%m.%d-%H%M)" >> "$GITHUB_OUTPUT"

      - name: Build image
        run: |
          docker run --rm --privileged \
            -v "$PWD":/ws -w /ws \
            "${{ needs.devcontainer-amd64.outputs.image }}" \
            make image IMG_VERSION=${{ steps.ver.outputs.version }}
          cd out && sha512sum *.img.xz > SHA512SUMS

      # provenance 用: image ビルド環境 (amd64 devcontainer) のパッケージ一覧
      - name: Build environment manifest
        run: |
          mkdir -p out/meta
          docker run --rm "${{ needs.devcontainer-amd64.outputs.image }}" \
            dpkg-query -W -f '${Package}=${Version}\n' > out/meta/build-env-amd64.txt

      - name: Upload build environment manifest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image-meta
          path: out/meta/build-env-amd64.txt
          if-no-files-found: error

      - name: Upload image
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image
          path: |
            out/*.img.xz
            out/SHA512SUMS
          if-no-files-found: error

  # ステージ 4: QEMU ブートテスト。リリースと同一の .img.xz を U-Boot →
  # extlinux → 実カーネルで実際にブートし、ゲスト内検査 (ログイン、networkd、
  # 容量拡張、nft、incus、k3s) を通す。arm64 ゲストの QEMU は TCG になるため
  # ランナーは x64 でよい (KVM は libguestfs の前処理にだけ効く)
  boot-test:
    needs: [devcontainer-amd64, image]
    # qemu / u-boot-qemu / expect も snapshot 固定済みの devcontainer 内で実行し、
    # ランナー環境への依存を無くす (arm64 ゲストの QEMU は TCG。KVM は
    # libguestfs の前処理にだけ効く)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download image
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: image
          path: out

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true

      - name: Boot test
        run: |
          docker run --rm --privileged \
            -v "$PWD":/ws -w /ws \
            "${{ needs.devcontainer-amd64.outputs.image }}" \
            bash -c 'scripts/boot-test.sh out/*.img.xz'

  # ステージ 5: リリース作成 (main への push のみ。PR では検証だけ行う)。
  # 成果物に加えて provenance (lock / 各 manifest / コンテナ digest / commit) を
  # 同梱し、後からどの依存で作られたか監査できるようにする
  release:
    # main への push のみ (workflow_dispatch は検証専用: 依存更新 PR の
    # 自動コミット後の再検証に使うため、誤って PR ブランチから
    # リリースされないようにする)
    if: github.event_name == 'push'
    needs: [devcontainer, devcontainer-amd64, rootfs, image, boot-test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download image
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: image
          path: out

      - name: Download rootfs metadata
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: rootfs-meta
          path: out/meta

      - name: Download image metadata
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: image-meta
          path: out/meta

      - name: Compose provenance
        run: |
          cp dependencies.lock.yaml out/meta/
          cat > out/meta/provenance.yaml << EOF
          # このリリースを生成した入力の記録
          source_commit: ${GITHUB_SHA}
          workflow_run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          devcontainer_arm64:
            image: ${{ needs.devcontainer.outputs.image }}
            digest: ${{ needs.devcontainer.outputs.digest }}
          devcontainer_amd64:
            image: ${{ needs.devcontainer-amd64.outputs.image }}
            digest: ${{ needs.devcontainer-amd64.outputs.digest }}
          EOF

      - name: Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ needs.image.outputs.version }}
          files: |
            out/*.img.xz
            out/SHA512SUMS
            out/meta/**
