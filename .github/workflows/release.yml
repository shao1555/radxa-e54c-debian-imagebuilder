name: Build and release image
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # arm64 ランナー (パブリックリポジトリでは無料)。QEMU 不要のネイティブビルドになり、
    # カーネルビルドも rootfs 構築も大幅に速い。
    # amd64 ランナーに戻す場合は ubuntu-latest + docker/setup-qemu-action を復活させること
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Generate version (CalVer, JST)
        id: ver
        run: echo "version=$(TZ=Asia/Tokyo date +v%Y.%m.%d-%H%M)" >> "$GITHUB_OUTPUT"

      # ローカル開発と同一の devcontainer 内でビルドする (環境の一致を保証)
      - name: Build within devcontainer
        uses: devcontainers/ci@v0.3
        with:
          push: never
          runCmd: |
            set -euo pipefail
            make all VERSION=${{ steps.ver.outputs.version }}
            cd out && sha512sum *.img.xz > SHA512SUMS

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.version }}
          files: |
            out/*.img.xz
            out/SHA512SUMS
            out/rootfs/build/manifest
            out/rootfs/bdebstrap.yaml
