# SPDX-License-Identifier: GPL-2.0-only
apiVersion: e54c.image/v1alpha1
kind: Module

metadata:
  id: default-user
  description: 既定ログインアカウントと初期アクセス方針

packages:
  apt:
    # login: trixie では Essential でなくなり variant=apt に含まれない。
    # 無いと agetty が login(1) を exec できず、シリアルコンソールから
    # 一切ログインできなくなる (QEMU ブートテストで検出した実績あり)
    - login
    - sudo

configuration:
  schema:
    type: object
    additionalProperties: false
    required:
      - username
      - requirePasswordChange
    properties:
      username:
        type: string
        pattern: "^[a-z_][a-z0-9_-]{0,31}$"
        description: 既定ユーザー名
      requirePasswordChange:
        type: boolean
        description: >
          初回ログイン時のパスワード変更強制 (chage -d 0)。false は既知の
          初期パスワードのまま運用され得るため安全性が下がる。教室など
          授業中の強制変更を避けたい環境でのみ明示的に選択すること
  defaults:
    username: debian
    requirePasswordChange: true

secrets:
  initial-password:
    required: true
    description: 既定ユーザーへ設定する初期パスワード

hooks:
  rootfs.customize:
    - hooks/create-user.sh

tests:
  rootfs:
    - tests/rootfs.sh
