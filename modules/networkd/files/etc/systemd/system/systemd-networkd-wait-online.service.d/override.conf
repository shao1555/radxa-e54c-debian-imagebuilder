# systemd-networkd-wait-online の待ち方の調整。
# ルーター用途では lan1 未接続のまま起動することも普通にあるため、既定の
# 「networkd が管理し online 必須とされる全リンクが上がるまで (最大 120 秒)」ではなく
# 「いずれか 1 リンクが上がれば OK、最大 10 秒」にして、network-online.target
# 依存サービス (incus 等) の起動遅延を抑える。タイムアウトしても
# network-online.target は進行する。
#
# カスタマイズはこのファイルを編集するだけでよい (files/ overlay がそのまま
# rootfs の同パスに配置される)。wait-online 自体を無効化したい場合は、
# ここの ExecStart を /bin/true に変える。
# (注意 1: この drop-in を /dev/null への symlink にしても mask にはならず、
#  vendor unit の既定 = 最大 120 秒待ちに戻るだけ)
# (注意 2: overlay で unit を mask してはいけない。ビルド中の
#  `systemctl enable systemd-networkd` が Also= で wait-online を enable する際に
#  失敗する。構築済みの実機で unit ごと止めたい場合のみ
#  `systemctl mask systemd-networkd-wait-online.service` を使うこと)
[Service]
ExecStart=
ExecStart=/usr/lib/systemd/systemd-networkd-wait-online --any --timeout=10
