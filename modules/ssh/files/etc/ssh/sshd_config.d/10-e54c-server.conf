# E54C server OS の sshd 設定。
# Debian の sshd_config は先頭で sshd_config.d/*.conf を Include し、
# OpenSSH は「最初に得た値が勝つ」ため、このファイルの値が既定より優先される。
#
# 公開鍵を配置したら (~debian/.ssh/authorized_keys)、下の 1 行を no に
# 変えるだけでパスワード認証を無効化できる。
PasswordAuthentication yes

# root 直ログインは Debian 既定で鍵のみ (prohibit-password)。
# 完全に禁止する場合はコメントを外す。
#PermitRootLogin no
